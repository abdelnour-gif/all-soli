# QueuePro on Nginx + PHP-FPM (Apache / LiteSpeed users do not need this file: .htaccess handles everything)
server {
    listen 80;
    server_name example.com;
    root /var/www/queuepro;          # the folder that contains index.php
    client_max_body_size 4m;

    # Never serve internal folders, the database, logs or hidden files
    location ~ ^/(storage|app|bin|tests|templates|docs)(/|$) { deny all; return 404; }
    location ~ /\.                  { deny all; return 404; }
    location ~* \.(sqlite|sqlite3|db|log|md|lock)$ { deny all; return 404; }

    # Uploaded images: static only, never executed
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar)$ { deny all; return 404; }
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox";
        try_files $uri =404;
    }
    location ^~ /assets/ { expires 30d; try_files $uri =404; }

    # Everything else → the application (internal rewrite, the PHP file itself is never served as text)
    location / { rewrite ^ /index.php last; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adjust to your PHP version
    }
    location ~ \.php$ { return 404; }
}
