# التشغيل:
#   docker compose up -d                      ← البوت بالمحرك المدمج
#   docker compose --profile ollama up -d     ← البوت + نموذجك على Ollama
services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - bot-data:/data

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
      - ../:/workspace:ro          # باش تقدر تدير: ollama create darja -f /workspace/Modelfile
    # إذا عندك كرت NVIDIA، نحّي # من الأسطر تحت:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  bot-data:
  ollama-models:
