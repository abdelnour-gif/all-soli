# التشغيل:
#   docker compose up -d                                  ← البوت بالمحرك المدمج (http://localhost:8000)
#   docker compose --profile https up -d                  ← + https أوتوماتيكي بـ Caddy (حط DOMAIN في .env)
#   docker compose --profile ollama up -d                 ← + نموذجك على Ollama
#   docker compose --profile https --profile ollama up -d ← كلشي
services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # البوت ما يتوصلش من برا غير عبر البروكسي (Caddy/Nginx)، لهذا نثقو في العنوان اللي يبعثو
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      # 127.0.0.1 = البوت يبان غير في السيرفر نفسو (البروكسي يوصلو). حط 0.0.0.0 باش تجرب من برا بلا https
      - "${BOT_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - bot-data:/data

  caddy:
    image: caddy:2.8.4
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [bot]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
      - ../:/workspace:ro          # باش تقدر تدير: ollama create darja -f /workspace/Modelfile
    # إذا عندك كرت NVIDIA، نحّي # من الأسطر تحت:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  bot-data:
  ollama-models:
  caddy-data:
